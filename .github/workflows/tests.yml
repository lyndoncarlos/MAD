name: tests

on: [push, pull_request]

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    container:
      # Match the Godot version you develop with. Check the image tag exists.
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Import project (registers class_name scripts)
        run: godot --headless --import || true
      - name: Run tests
        run: godot --headless --script res://tests/run_tests.gd
